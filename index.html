<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angry Birds — Ultimate Edition (Perfect Physics + Music)</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #0a0e27; user-select: none; -webkit-tap-highlight-color: transparent;
        display: flex; justify-content: center; align-items: center;
    }
    #gameWrap { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas {
        display: block; border-radius: 14px; box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 25px 70px rgba(0,0,0,0.65);
        cursor: grab; touch-action: none; max-width: 100%; max-height: 100%;
    }
    canvas:active { cursor: grabbing; }
    
    #fps-counter { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); color: #0f0; padding: 5px 10px; border-radius: 8px; font-family: monospace; font-weight: bold; z-index: 99; pointer-events: none; display: none; }
    
    .hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; pointer-events: none; }
    .pill { background: linear-gradient(180deg, #fff, #e0eaff); border-radius: 40px; padding: 10px 22px; font-weight: 800; font-size: 17px; color: #1a2340; box-shadow: 0 6px 20px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 8px; }
    .pill .icon { font-size: 20px; }
    #score { color: #e63946; font-size: 20px; }
    #levelNameHud { color: #1971c2; }
    .controls { position: absolute; bottom: 24px; right: 24px; display: flex; gap: 12px; z-index: 10; }
    button.btn { border: none; border-radius: 14px; padding: 13px 24px; font-size: 15px; font-weight: 800; color: white; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,0.25); transition: transform 0.12s; display: flex; align-items: center; gap: 8px; font-family: inherit; }
    button.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
    .btn-restart { background: linear-gradient(180deg, #ff8c42, #f4511e); }
    .btn-menu    { background: linear-gradient(180deg, #7e57c2, #4527a0); }
    .btn-play    { background: linear-gradient(180deg, #52b788, #2d6a4f); font-size: 18px; padding: 15px 42px; border-radius: 16px; }
    .hint { position: absolute; bottom: 24px; left: 24px; background: rgba(255,255,255,0.9); color: #1a2340; padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 700; z-index: 10; max-width: 260px; transition: opacity 0.5s; }
    .overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.4s; background: rgba(10,14,39,0.85); border-radius: 14px; }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay-card { background: linear-gradient(180deg, #fffbf2, #ffe9c7); border-radius: 28px; padding: 42px 56px; text-align: center; transform: scale(0.8); transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .overlay.show .overlay-card { transform: scale(1); }
    .overlay-title { font-size: 42px; font-weight: 900; margin-bottom: 12px; background: linear-gradient(180deg, #ff9a3c, #e63946); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .overlay-stars { font-size: 46px; margin: 14px 0 18px; letter-spacing: 6px; }
    .overlay-score { font-size: 22px; font-weight: 800; color: #4a3b2a; margin-bottom: 26px; }
    .overlay-score span { color: #e63946; font-size: 28px; }
    .overlay-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .menu-screen { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(180deg, #0a0e27 0%, #1a2151 30%, #3d4d8c 60%, #e8896b 100%); border-radius: 14px; opacity: 0; pointer-events: none; transition: opacity 0.5s; padding: 20px; overflow-y: auto; }
    .menu-screen.show { opacity: 1; pointer-events: auto; }
    .menu-title { font-size: 82px; font-weight: 900; background: linear-gradient(180deg, #ffd93d, #ff6b35, #e63946); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 6px 20px rgba(255,120,50,0.5)); margin-bottom: 6px; }
    .menu-subtitle { font-size: 20px; color: rgba(255,255,255,0.75); font-weight: 600; letter-spacing: 6px; margin-bottom: 42px; }
    .menu-buttons { display: flex; flex-direction: column; gap: 16px; width: min(360px, 90%); }
    .menu-btn { border: none; border-radius: 18px; padding: 20px 32px; font-size: 20px; font-weight: 800; color: white; cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,0.3); transition: transform 0.15s; }
    .menu-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .menu-btn.primary   { background: linear-gradient(180deg, #52b788, #2d6a4f); }
    .menu-btn.secondary { background: linear-gradient(180deg, #4dabf7, #1971c2); }
    .menu-btn.tertiary  { background: linear-gradient(180deg, #f5a623, #c87a00); }
    .menu-btn.quaternary{ background: linear-gradient(180deg, #f76b8a, #c9184a); }
    .menu-btn.settings  { background: linear-gradient(180deg, #667eea, #764ba2); }
    
    .levels-screen { position: absolute; inset: 0; z-index: 110; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, #1a2151 0%, #3d4d8c 50%, #7a6bb0 100%); border-radius: 14px; opacity: 0; pointer-events: none; transition: opacity 0.5s; padding: 30px 20px; overflow-y: auto; }
    .levels-screen.show { opacity: 1; pointer-events: auto; }
    .levels-header { display: flex; align-items: center; justify-content: space-between; width: min(900px, 100%); margin-bottom: 30px; }
    .levels-title { font-size: 46px; font-weight: 900; color: white; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .btn-back { border: none; border-radius: 14px; padding: 12px 22px; font-size: 15px; font-weight: 800; color: white; cursor: pointer; background: linear-gradient(180deg, #7e57c2, #4527a0); box-shadow: 0 5px 0 rgba(0,0,0,0.3); }
    
    .category-title { width: min(900px, 100%); color: white; font-size: 24px; font-weight: 800; margin-top: 20px; margin-bottom: 16px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; }
    .levels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 16px; width: min(900px, 100%); margin-bottom: 20px; }
    
    .level-card { background: linear-gradient(180deg, #fffbf2, #ffd9a0); border-radius: 20px; padding: 16px 12px; text-align: center; cursor: pointer; transition: transform 0.2s; box-shadow: 0 6px 0 rgba(120,80,40,0.5); position: relative; }
    .level-card:hover { transform: translateY(-5px); }
    .level-card.locked { filter: grayscale(0.85) brightness(0.65); cursor: not-allowed; }
    .level-num { font-size: 26px; font-weight: 900; color: #e63946; }
    .level-name { font-size: 13px; font-weight: 800; color: #4a3b2a; margin-bottom: 8px; min-height: 30px; display: flex; align-items: center; justify-content: center; }
    .level-birds { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
    .bird-icon { width: 26px; height: 26px; border-radius: 50%; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.4); }
    .bird-icon.red    { background: radial-gradient(circle at 35% 30%, #ff8080, #c81e1e 70%, #7a0a0a); }
    .bird-icon.yellow { background: radial-gradient(circle at 35% 30%, #fff59d, #ffc107 70%, #a87a00); clip-path: polygon(100% 50%, 0 0, 0 100%); border-radius: 0; border: none; }
    .bird-icon.blue   { background: radial-gradient(circle at 35% 30%, #90caf9, #2196f3 70%, #0d47a1); }
    .bird-icon.black  { background: radial-gradient(circle at 35% 30%, #6c757d, #212529 70%, #000); }
    .bird-icon.white  { background: radial-gradient(circle at 35% 30%, #ffffff, #cfd8dc 70%, #90a4ae); }
    .bird-icon::before { content: ''; position: absolute; width: 8px; height: 8px; background: white; border-radius: 50%; top: 32%; left: 22%; box-shadow: 6px 0 0 white; }
    .bird-icon::after { content: ''; position: absolute; width: 3px; height: 3px; background: #000; border-radius: 50%; top: 40%; left: 28%; box-shadow: 6px 0 0 #000; }
    .bird-icon.yellow::before { top: 38%; left: 30%; box-shadow: 6px 0 0 white; }
    .bird-icon.yellow::after { top: 46%; left: 36%; box-shadow: 6px 0 0 #000; }
    .level-stars { font-size: 16px; }
    .level-lock { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 46px; }
    
    .ability-indicator { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); border-radius: 16px; padding: 12px 24px; font-weight: 800; font-size: 15px; color: #1a2340; z-index: 11; display: none; align-items: center; gap: 10px; }
    .ability-indicator.show { display: flex; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
    .toast-ach { position: fixed; top: 80px; right: 20px; background: linear-gradient(180deg, #fff9e6, #ffd700); color: #4a3b2a; padding: 16px 24px; border-radius: 16px; font-weight: 800; font-size: 15px; z-index: 999; display: flex; align-items: center; gap: 12px; transform: translateX(400px); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; }
    .toast-ach.show { transform: translateX(0); }

    /* Настройки */
    .settings-screen { position: absolute; inset: 0; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #1a2151 0%, #3d4d8c 100%); border-radius: 14px; opacity: 0; pointer-events: none; transition: opacity 0.5s; padding: 30px 20px; }
    .settings-screen.show { opacity: 1; pointer-events: auto; }
    .settings-panel { background: rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; width: min(400px, 90%); display: flex; flex-direction: column; gap: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.2); border-radius: 12px; color: white; font-weight: 700; font-size: 16px; }
    .setting-btn { border: none; border-radius: 10px; padding: 8px 16px; font-weight: 800; cursor: pointer; transition: 0.2s; min-width: 90px; }
    .setting-btn.on { background: #4cd964; color: white; }
    .setting-btn.off { background: #ff3b30; color: white; }
    .setting-btn.neutral { background: rgba(255,255,255,0.2); color: white; }
    
    @media (max-width: 700px) { .hint { display: none; } .menu-title { font-size: 52px; } .levels-grid { grid-template-columns: repeat(2, 1fr); } .overlay-card { padding: 32px 34px; } .category-title { font-size: 20px; } }
</style>
</head>
<body>
<div id="gameWrap">
    <canvas id="gameCanvas"></canvas>
    <div id="fps-counter">FPS: 60</div>
    <div class="hud" id="hud" style="display:none;">
        <div class="pill"><span class="icon">⭐</span>Счёт: <span id="score">0</span></div>
        <div class="pill"><span class="icon">🏝️</span><span id="levelNameHud">Уровень</span></div>
    </div>
    <div class="hint" id="hint" style="display:none;">🎯 Потяни птицу и отпусти.<br>💥 Клик во время полёта — способность!</div>
    <div class="ability-indicator" id="abilityIndicator"><span id="abilityIcon">⚡</span><span id="abilityText">Клик!</span></div>
    <div class="controls" id="controls" style="display:none;">
        <button class="btn btn-menu" id="menuBtn">☰ Меню</button>
        <button class="btn btn-restart" id="restartBtn">🔄</button>
    </div>
    <div class="overlay" id="overlay">
        <div class="overlay-card">
            <div class="overlay-title" id="overlayTitle">Победа!</div>
            <div class="overlay-stars" id="overlayStars">⭐⭐⭐</div>
            <div class="overlay-score">Очки: <span id="overlayScore">0</span></div>
            <div class="overlay-buttons">
                <button class="btn btn-play" id="playAgainBtn">🔄 Ещё раз</button>
                <button class="btn btn-menu" id="nextLevelBtn" style="display:none;">▶ Далее</button>
                <button class="btn btn-menu" id="overlayMenuBtn">🏠 Меню</button>
            </div>
        </div>
    </div>
    
    <div class="menu-screen show" id="menuScreen">
        <div class="menu-title">ANGRY BIRDS</div>
        <div class="menu-subtitle">Ultimate Edition</div>
        <div class="menu-buttons">
            <button class="menu-btn primary" id="playBtn">🎮 Играть</button>
            <button class="menu-btn secondary" id="levelsBtn">🗺️ Уровни</button>
            <button class="menu-btn quaternary" id="achievementsBtn">🏆 Награды</button>
            <button class="menu-btn settings" id="settingsBtn">⚙️ Настройки</button>
        </div>
    </div>
    
    <div class="levels-screen" id="levelsScreen">
        <div class="levels-header"><div class="levels-title">Уровни</div><button class="btn-back" id="backBtn">← Назад</button></div>
        <div id="levelsContainer" style="width: min(900px, 100%);"></div>
    </div>

    <div class="levels-screen" id="achievementsScreen" style="z-index: 115;">
        <div class="levels-header"><div class="levels-title">🏆 Награды</div><button class="btn-back" id="achBackBtn">← Назад</button></div>
        <div class="levels-grid" id="achievementsGrid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));"></div>
    </div>

    <div class="settings-screen" id="settingsScreen">
        <div class="levels-header" style="position: absolute; top: 30px; width: min(900px, 100%);">
            <div class="levels-title">⚙️ Настройки</div>
            <button class="btn-back" id="settingsBackBtn">← Назад</button>
        </div>
        <div class="settings-panel">
            <div class="setting-row"><span>🎵 Музыка</span><button class="setting-btn on" id="musicToggle">Вкл</button></div>
            <div class="setting-row"><span>🔊 Звуки</span><button class="setting-btn on" id="soundToggle">Вкл</button></div>
            <div class="setting-row"><span>⚙️ Идеальная физика</span><button class="setting-btn on" id="physicsToggle">Вкл</button></div>
            <div class="setting-row"><span>✨ Графика</span><button class="setting-btn on" id="graphicsToggle">Высокая</button></div>
            <div class="setting-row"><span>📺 FPS Счётчик</span><button class="setting-btn on" id="fpsToggle">Вкл</button></div>
            <div class="setting-row"><span>👤 Авторы</span><button class="setting-btn neutral" id="authorsBtn">Открыть</button></div>
            <div class="setting-row"><span>💾 Сохранение</span><button class="setting-btn off" id="resetSaveBtn">Сбросить</button></div>
        </div>
    </div>

    <div class="levels-screen" id="creditsScreen" style="z-index: 125; justify-content: center; background: rgba(10,14,39,0.95);">
        <div class="levels-title" style="margin-bottom: 20px;">Создатели</div>
        <div style="color: white; font-size: 24px; line-height: 2; text-align: center; font-weight: bold;">
            RedDarkWoid<br>DeepSeek<br>Лекс
        </div>
        <button class="btn btn-play" style="margin-top: 40px;" id="creditsBackBtn">Назад</button>
    </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
const W = 1000, H = 640; canvas.width = W; canvas.height = H;
function resizeCanvas() { const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.96; canvas.style.width = (W * s) + 'px'; canvas.style.height = (H * s) + 'px'; }
window.addEventListener('resize', resizeCanvas); resizeCanvas();

const $ = id => document.getElementById(id);
const scoreEl = $('score'), levelNameHud = $('levelNameHud'), hud = $('hud'), controls = $('controls'), hint = $('hint');
const abilityIndicator = $('abilityIndicator'), abilityIcon = $('abilityIcon'), abilityText = $('abilityText');
const overlay = $('overlay'), overlayTitle = $('overlayTitle'), overlayStars = $('overlayStars'), overlayScore = $('overlayScore');
const playAgainBtn = $('playAgainBtn'), nextLevelBtn = $('nextLevelBtn'), overlayMenuBtn = $('overlayMenuBtn'), restartBtn = $('restartBtn'), menuBtn = $('menuBtn');
const menuScreen = $('menuScreen'), levelsScreen = $('levelsScreen'), levelsContainer = $('levelsContainer'), playBtn = $('playBtn'), levelsBtn = $('levelsBtn'), backBtn = $('backBtn');
const achievementsBtn = $('achievementsBtn'), achievementsScreen = $('achievementsScreen'), achievementsGrid = $('achievementsGrid'), achBackBtn = $('achBackBtn');
const settingsBtn = $('settingsBtn'), settingsScreen = $('settingsScreen'), settingsBackBtn = $('settingsBackBtn');
const musicToggle = $('musicToggle'), soundToggle = $('soundToggle'), physicsToggle = $('physicsToggle'), graphicsToggle = $('graphicsToggle'), fpsToggle = $('fpsToggle'), authorsBtn = $('authorsBtn'), resetSaveBtn = $('resetSaveBtn');
const creditsScreen = $('creditsScreen'), creditsBackBtn = $('creditsBackBtn');
const fpsCounter = $('fps-counter');

const SAVE_KEY = 'angryBirds_ultimate_v23';
const SETTINGS_KEY = 'angryBirds_settings_v8';

let settings = { music: true, sound: true, perfectPhysics: true, highGraphics: true, showFps: true };
function loadSettings() { try { const r = localStorage.getItem(SETTINGS_KEY); if (r) settings = Object.assign(settings, JSON.parse(r)); } catch(e) {} }
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); updateSettingsUI(); }
function updateSettingsUI() {
    musicToggle.textContent = settings.music ? 'Вкл' : 'Выкл'; musicToggle.className = 'setting-btn ' + (settings.music ? 'on' : 'off');
    soundToggle.textContent = settings.sound ? 'Вкл' : 'Выкл'; soundToggle.className = 'setting-btn ' + (settings.sound ? 'on' : 'off');
    physicsToggle.textContent = settings.perfectPhysics ? 'Вкл' : 'Выкл'; physicsToggle.className = 'setting-btn ' + (settings.perfectPhysics ? 'on' : 'off');
    graphicsToggle.textContent = settings.highGraphics ? 'Высокая' : 'Низкая'; graphicsToggle.className = 'setting-btn ' + (settings.highGraphics ? 'on' : 'off');
    fpsToggle.textContent = settings.showFps ? 'Вкл' : 'Выкл'; fpsToggle.className = 'setting-btn ' + (settings.showFps ? 'on' : 'off');
    fpsCounter.style.display = settings.showFps ? 'block' : 'none';
}

let saveData = { levels: {}, achievements: {}, stats: { birds: 0, pigs: 0, blocks: 0, abilities: 0 } };
function loadSave() { try { const r = localStorage.getItem(SAVE_KEY); if (r) { saveData = JSON.parse(r); if (!saveData.stats) saveData.stats = { birds: 0, pigs: 0, blocks: 0, abilities: 0 }; } } catch(e) {} }
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch(e) {} }

const ACHIEVEMENTS = {
    firstWin: { icon: '🎯', name: 'Первая победа', desc: 'Пройди 1 уровень', cond: () => Object.keys(saveData.levels).length >= 1 },
    threeStars: { icon: '⭐', name: 'Идеально!', desc: 'Получи 3 звезды', cond: () => Object.values(saveData.levels).some(l => l.stars === 3) },
    tenLvls: { icon: '🏆', name: 'Опытный', desc: 'Пройди 10 уровней', cond: () => Object.keys(saveData.levels).length >= 10 },
    allLvls: { icon: '👑', name: 'Мастер', desc: 'Пройди все 25 уровней', cond: () => Object.keys(saveData.levels).length >= 25 },
    pig100: { icon: '🐷', name: 'Охотник', desc: 'Убей 100 свиней', cond: () => saveData.stats.pigs >= 100 },
    pig300: { icon: '💀', name: 'Истребитель', desc: 'Убей 300 свиней', cond: () => saveData.stats.pigs >= 300 },
    bird200: { icon: '🐦', name: 'Птицелов', desc: 'Запусти 200 птиц', cond: () => saveData.stats.birds >= 200 },
    block300: { icon: '🪓', name: 'Разрушитель', desc: 'Сломай 300 блоков', cond: () => saveData.stats.blocks >= 300 },
    ability50: { icon: '⚡', name: 'Мастер силы', desc: 'Используй 50 способностей', cond: () => saveData.stats.abilities >= 50 },
    allStars: { icon: '🌟', name: 'Перфекционист', desc: 'Собери 60 звёзд', cond: () => { let t=0; Object.values(saveData.levels).forEach(l=>t+=l.stars||0); return t>=60; } }
};
let achQueue = [];
function checkAchievements() {
    let n = false; for (const [id, a] of Object.entries(ACHIEVEMENTS)) { if (!saveData.achievements[id] && a.cond()) { saveData.achievements[id] = true; achQueue.push(a); n = true; } }
    if (n) { saveGame(); processAchQueue(); }
}
function processAchQueue() {
    if (!achQueue.length) return; const a = achQueue.shift();
    const t = document.createElement('div'); t.className = 'toast-ach';
    t.innerHTML = `<span style="font-size:32px;">${a.icon}</span><div><div style="font-size:11px; opacity:0.7;">🏆 ДОСТИЖЕНИЕ</div><div>${a.name}</div><div style="font-size:11px; opacity:0.6; font-weight:600;">${a.desc}</div></div>`;
    document.body.appendChild(t); requestAnimationFrame(() => t.classList.add('show')); SFX.star();
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 500); }, 3500); setTimeout(processAchQueue, 4000);
}

const BIOMES = {
    day:    { name: 'День', skyTop: '#87CEEB', skyMid: '#B0E0FF', skyBot: '#E0F6FF', ground1: '#7bc043', ground2: '#3f7a22', mountain: 'rgba(100,150,200,0.3)', icon: '☀️' },
    sunset: { name: 'Утро', skyTop: '#1a2151', skyMid: '#3d4d8c', skyBot: '#ffd89b', ground1: '#7bc043', ground2: '#3f7a22', mountain: 'rgba(60,50,110,0.55)', icon: '🌅' },
    desert: { name: 'Пустыня', skyTop: '#f6d365', skyMid: '#fda085', skyBot: '#ffedbc', ground1: '#f0c27b', ground2: '#9c6b3e', mountain: 'rgba(180,120,80,0.5)', icon: '🏜️' },
    night:  { name: 'Ночь', skyTop: '#0f0c29', skyMid: '#302b63', skyBot: '#24243e', ground1: '#2d5a27', ground2: '#1a3a15', mountain: 'rgba(20,15,50,0.8)', icon: '🌙' },
    ice:    { name: 'Зима', skyTop: '#83a4d4', skyMid: '#b6fbff', skyBot: '#ffffff', ground1: '#e0f7fa', ground2: '#80deea', mountain: 'rgba(150,180,200,0.5)', icon: '❄️' }

function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } }
function beep(f, d, t='sine', v=0.15, s=null) {
    if (!settings.sound || !audioCtx) return;

    o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime); if (s) o.frequency.exponentialRampToValueAtTime(s, audioCtx.currentTime + d);
    g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
}

// Генератор музыки
function playMusicNote(freq, duration, vol=0.05, type='square') {
    if (!audioCtx || !settings.music) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + duration);
}

function startMusic() {
    if (musicTimer) return;
    ensureAudio();
    if (!audioCtx) return;
    
    const melody = [440, 493.88, 523.25, 587.33, 659.25, 587.33, 523.25, 493.88];
    const bass = [110, 110, 130.81, 130.81, 146.83, 146.83, 164.81, 164.81];
    
    let step = 0;
    musicTimer = setInterval(() => {
        if (!settings.music) return;
        playMusicNote(melody[step % melody.length], 0.2, 0.04, 'square');
        if (step % 2 === 0) playMusicNote(bass[Math.floor(step / 2) % bass.length], 0.4, 0.08, 'triangle');
        if (step % 2 === 0) playMusicNote(100, 0.1, 0.1, 'sawtooth');
        step++;
    }, 250);
}

function stopMusic() {
    if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

    else if (tK === 'yellow') { ctx.beginPath(); ctx.moveTo(-R*0.4, -R*0.95); ctx.quadraticCurveTo(-R*0.55, -R*1.6, -R*0.15, -R*1.3); ctx.quadraticCurveTo(-R*0.25, -R*1.1, 0, -R*1.0); ctx.closePath(); ctx.fillStyle = t.color1; ctx.fill(); ctx.strokeStyle = t.color3; ctx.lineWidth = 1.2; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-R*0.05, -R*1.0); ctx.quadraticCurveTo(R*0.15, -R*1.65, R*0.5, -R*1.15); ctx.quadraticCurveTo(R*0.2, -R*1.2, R*0.3, -R*1.0); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    else if (tK === 'blue') { ctx.beginPath(); ctx.moveTo(-R*0.2, -R*0.85); ctx.quadraticCurveTo(-R*0.1, -R*1.4, R*0.2, -R*1.0); ctx.closePath(); ctx.fillStyle = t.color1; ctx.fill(); ctx.strokeStyle = t.color3; ctx.lineWidth = 1; ctx.stroke(); }
    else if (tK === 'white') { ctx.beginPath(); ctx.moveTo(-R*0.15, -R*0.95); ctx.quadraticCurveTo(-R*0.3, -R*1.55, R*0.15, -R*1.2); ctx.quadraticCurveTo(R*0.0, -R*1.1, R*0.15, -R*0.95); ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.stroke(); }
}

class Egg {
    constructor(x, y, p) { this.x=x; this.y=y; this.vx=0; this.vy=2; this.r=12; this.parent=p; this.exploded=false; }
    update() { if (this.exploded) return; this.vy += GRAVITY; this.x += this.vx; this.y += this.vy;
        if (this.y + this.r >= GROUND_Y) { this.y = GROUND_Y - this.r; this.explode(); return; }
        for (const p of pigs) { if (!p.dead && dist(this.x, this.y, p.x, p.y) < this.r + p.r) { this.explode(); return; } }
        for (const b of blocks) { if (b.hp > 0 && this.x > b.x-this.r && this.x < b.x+b.w+this.r && this.y > b.y-this.r && this.y < b.y+b.h+this.r) { this.explode(); return; } } }
    explode() { if (this.exploded) return; this.exploded = true; SFX.explosion(); state.shake = 18; const R = 100;
        for (let i = 0; i < 30; i++) { const a = rand(0, Math.PI*2), s = rand(3,12); particles.push(new Particle(this.x, this.y, ['#ff6b35','#ffd93d','#fff'][randInt(0,2)], {vx:Math.cos(a)*s, vy:Math.sin(a)*s-2, size:rand(3,9), gravity:0.2, decay:0.02})); }
        pigs.forEach(p => { if (!p.dead && dist(this.x, this.y, p.x, p.y) < R) { p.damage(999, Math.atan2(p.y-this.y,p.x-this.x)); p.resting=false; } });
        blocks.forEach(b => { if (b.hp>0 && dist(this.x, this.y, b.x+b.w/2, b.y+b.h/2) < R) { b.damage(clamp(180*(1-dist(this.x,this.y,b.x+b.w/2,b.y+b.h/2)/R),30,180)); b.resting=false; } }); }
    draw() { if (this.exploded) return; ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.vx * 0.05); ctx.shadowColor = '#ff6b35'; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.ellipse(0, 0, this.r, this.r * 1.25, 0, 0, Math.PI * 2); const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, this.r * 1.3); g.addColorStop(0, '#fff'); g.addColorStop(1, '#e0e0e0'); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#adb5bd'; ctx.lineWidth = 2; ctx.stroke(); ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(2, -2); ctx.lineTo(-2, 4); ctx.lineTo(3, 10); ctx.strokeStyle = '#ff6b35'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); }
}

class Pig {
    constructor(x, y, r = 26, type = 'normal') { this.x=x; this.y=y; this.r=r; this.type=type; this.vx=0; this.vy=0; this.hp = type==='boss' ? 3 : 1; this.dead=false; this.resting=true; this.hurtFlash=0; this.blink=0; this.squish=0; this.breathing=Math.random()*Math.PI*2; }
    damage(amount, angle) { 
        if (this.dead) return; 
        if (this.type === 'helmet' && angle !== undefined) {
            const deg = (angle * 180 / Math.PI) % 360;
            if (deg > 45 && deg < 135) { SFX.wood(); spawnBurst(this.x, this.y - this.r, '#ccc', 8); return; }
        }
        this.hp -= amount; this.hurtFlash = 12; this.squish = 1;
        if (this.hp <= 0) { 
            this.dead = true; 
            const pts = this.type==='boss' ? 10000 : (this.type==='helmet' ? 2000 : 5000);
            state.score += pts; addScore(pts, this.x, this.y); 
            SFX.pop(); spawnBurst(this.x, this.y, '#90ee90', 22); spawnFeathers(this.x, this.y, 6, '#90ee90'); state.shake = 8; saveData.stats.pigs++; saveGame(); 
        } else { SFX.wood(); } 
    }
    update() { if (this.hurtFlash > 0) this.hurtFlash--; if (this.squish > 0) this.squish *= 0.85; if (this.blink > 0) this.blink--; else if (Math.random() < 0.01) this.blink = 10; this.breathing += 0.05;
        if (!this.resting && !this.dead) { this.vy += GRAVITY; this.vx *= AIR; this.x += this.vx; this.y += this.vy;
            if (this.y + this.r >= GROUND_Y) { this.y = GROUND_Y - this.r; if (Math.abs(this.vy) > 4) this.damage(Math.abs(this.vy) * 3); this.vy *= -0.35; this.vx *= 0.7;
                if (Math.abs(this.vy) < 1.2 && Math.abs(this.vx) < 0.7) { this.vy = 0; this.vx = 0; this.resting = true; } }
            if (this.x - this.r < 0) { this.x = this.r; this.vx *= -0.5; } if (this.x + this.r > W) { this.x = W - this.r; this.vx *= -0.5; } } }
    draw() { if (this.dead) return; const R = this.r, br = Math.sin(this.breathing) * 0.03, sx = 1 + this.squish * 0.25 + br, sy = 1 - this.squish * 0.25 - br;
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(sx, sy);
        if (settings.highGraphics) { ctx.beginPath(); ctx.ellipse(0, R * 0.95, R * 0.9, R * 0.25, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fill(); }
        const bg = ctx.createRadialGradient(-R*0.35, -R*0.4, R*0.1, 0, 0, R*1.15); 
        if (this.type === 'boss') { bg.addColorStop(0, '#ffb347'); bg.addColorStop(0.5, '#ff8c00'); bg.addColorStop(1, '#b35c00'); }
        else if (this.hurtFlash > 0) { bg.addColorStop(0, '#ffb3b3'); bg.addColorStop(0.5, '#ff6b6b'); bg.addColorStop(1, '#b03030'); } 
        else { bg.addColorStop(0, '#c5f7ae'); bg.addColorStop(0.5, '#79d65c'); bg.addColorStop(1, '#3f8a2a'); }
        ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill();
        if (settings.highGraphics) { ctx.beginPath(); ctx.ellipse(-R*0.35, -R*0.45, R*0.35, R*0.22, -0.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill(); }
        ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(30,70,20,0.8)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(-R*0.75, -R*0.55, R*0.22, R*0.3, -0.6, 0, Math.PI * 2); ctx.fillStyle = '#5cae42'; ctx.fill(); ctx.strokeStyle = '#3f8a2a'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(R*0.75, -R*0.55, R*0.22, R*0.3, 0.6, 0, Math.PI * 2); ctx.fillStyle = '#5cae42'; ctx.fill(); ctx.stroke();
        const eo = this.blink > 0 ? 0.1 : 1;
        ctx.beginPath(); ctx.ellipse(-R*0.3, -R*0.2, R*0.22, R*0.26 * eo, 0, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill(); ctx.strokeStyle = '#2d4d1e'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(R*0.3, -R*0.2, R*0.22, R*0.26 * eo, 0, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill(); ctx.stroke();
        if (this.blink <= 0) { ctx.beginPath(); ctx.arc(-R*0.28, -R*0.18, R*0.1, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); ctx.beginPath(); ctx.arc(R*0.28, -R*0.18, R*0.1, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill();
            ctx.beginPath(); ctx.arc(-R*0.31, -R*0.22, R*0.04, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill(); ctx.beginPath(); ctx.arc(R*0.25, -R*0.22, R*0.04, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill(); }
        ctx.beginPath(); ctx.ellipse(0, R*0.28, R*0.42, R*0.32, 0, 0, Math.PI * 2); const sg = ctx.createRadialGradient(-R*0.1, R*0.2, 2, 0, R*0.28, R*0.5); sg.addColorStop(0, '#b8f0a0'); sg.addColorStop(1, '#5cae42');
        ctx.fillStyle = sg; ctx.fill(); ctx.strokeStyle = '#2d4d1e'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(-R*0.13, R*0.28, R*0.06, R*0.09, 0, 0, Math.PI * 2); ctx.fillStyle = '#2d4d1e'; ctx.fill(); ctx.beginPath(); ctx.ellipse(R*0.13, R*0.28, R*0.06, R*0.09, 0, 0, Math.PI * 2); ctx.fillStyle = '#2d4d1e'; ctx.fill(); 
        if (this.type === 'helmet') {
            ctx.beginPath(); ctx.arc(0, -R*0.3, R*0.95, Math.PI, 0); ctx.lineTo(R*1.0, -R*0.3); ctx.lineTo(-R*1.0, -R*0.3); ctx.closePath();
            const hg = ctx.createLinearGradient(0, -R*1.2, 0, -R*0.3); hg.addColorStop(0, '#a0a0a0'); hg.addColorStop(1, '#505050');
            ctx.fillStyle = hg; ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
        }
        if (this.type === 'boss') {
            ctx.beginPath(); ctx.moveTo(-R*0.6, -R*0.8); ctx.lineTo(-R*0.8, -R*1.3); ctx.lineTo(-R*0.3, -R*1.0); ctx.lineTo(0, -R*1.5); ctx.lineTo(R*0.3, -R*1.0); ctx.lineTo(R*0.8, -R*1.3); ctx.lineTo(R*0.6, -R*0.8); ctx.closePath();
            ctx.fillStyle = '#ffd700'; ctx.fill(); ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-R*1.2, R*1.2, R*2.4, 6);
            ctx.fillStyle = '#ff3b30'; ctx.fillRect(-R*1.2, R*1.2, R*2.4 * (this.hp/3), 6);
        }
        ctx.restore();
    }
}

class Block {
    constructor(x, y, w, h, type = 'wood') { 
        this.x=x; this.y=y; this.w=w; this.h=h; this.type=type; this.vx=0; this.vy=0; this.resting=true; 
        if(type==='stone') this.hp = 200;
        else if(type==='glass') this.hp = 30;
        else this.hp = 100;
        this.maxHp=this.hp; this.flash=0; this.rot=0; this.rotVel=0; this.texSeed = (x*7+y*13+w*3)%100; 
    }
    damage(amount) { this.hp -= amount; this.flash = 10;
        if (this.hp <= 0) { 
            SFX.wood(); 
            const col = this.type==='stone'?'#9aa5b1':(this.type==='glass'?'#e0f7fa':'#c8965c');
            spawnBurst(this.x+this.w/2, this.y+this.h/2, col, 14); 
            state.score += this.type==='glass' ? 200 : 500; addScore(this.type==='glass' ? 200 : 500, this.x+this.w/2, this.y+this.h/2); 
            saveData.stats.blocks++; saveGame(); 
        } 
    }
    update() { 
        if (this.flash > 0) this.flash--; if (this.hp <= 0) return;
        if (!this.resting) { this.vy += GRAVITY; this.vx *= AIR; this.x += this.vx; this.y += this.vy; this.rot += this.rotVel;
            if (this.y + this.h >= GROUND_Y) { this.y = GROUND_Y - this.h; this.vy *= -0.3; this.vx *= 0.7; this.rotVel *= 0.5;
                if (Math.abs(this.vy) < 1 && Math.abs(this.vx) < 0.5) { this.vy = 0; this.vx = 0; this.resting = true; this.rotVel = 0; } }
            if (this.x < 0) { this.x = 0; this.vx *= -0.5; } if (this.x + this.w > W) { this.x = W - this.w; this.vx *= -0.5; } } 
    }
    draw() { 
        if (this.hp <= 0) return;
        ctx.save(); ctx.translate(this.x + this.w/2, this.y + this.h/2); ctx.rotate(this.rot); const x = -this.w/2, y = -this.h/2;
        if (settings.highGraphics) { ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4; }
        let grad;
        if (this.type === 'stone') { grad = ctx.createLinearGradient(x, y, x+this.w, y+this.h); if (this.flash > 0) { grad.addColorStop(0, '#ffcccc'); grad.addColorStop(1, '#cc8888'); } else { grad.addColorStop(0, '#c5cdd6'); grad.addColorStop(0.5, '#7d8896'); grad.addColorStop(1, '#4d5762'); } }
        else if (this.type === 'glass') { grad = ctx.createLinearGradient(x, y, x+this.w, y+this.h); if (this.flash > 0) { grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#aaa'); } else { grad.addColorStop(0, 'rgba(200,240,255,0.7)'); grad.addColorStop(0.5, 'rgba(150,210,240,0.6)'); grad.addColorStop(1, 'rgba(100,180,220,0.7)'); } }
        else { grad = ctx.createLinearGradient(x, y, x, y+this.h); if (this.flash > 0) { grad.addColorStop(0, '#ffb3b3'); grad.addColorStop(1, '#cc6666'); } else { grad.addColorStop(0, '#e0b078'); grad.addColorStop(0.4, '#c8965c'); grad.addColorStop(1, '#8a5c2c'); } }
        ctx.fillStyle = grad; ctx.fillRect(x, y, this.w, this.h); ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        
        if (this.type === 'wood') { 
            ctx.strokeStyle = 'rgba(80,40,10,0.35)'; ctx.lineWidth = 1; const iV = this.h > this.w, c = Math.max(2, Math.floor(iV ? this.w/8 : this.h/8));
            for (let i = 1; i < c; i++) { ctx.beginPath(); if (iV) { const px = x + i*(this.w/c); ctx.moveTo(px, y); ctx.lineTo(px, y+this.h); } else { const py = y + i*(this.h/c); ctx.moveTo(x, py); ctx.lineTo(x+this.w, py); } ctx.stroke(); } 
        } else if (this.type === 'glass') {
            ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x+2, y+2); ctx.lineTo(x+this.w/2, y+this.h/2); ctx.lineTo(x+2, y+this.h-2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+this.w-2, y+2); ctx.lineTo(x+this.w/2, y+this.h/2); ctx.lineTo(x+this.w-2, y+this.h-2); ctx.stroke();
        } else { 
            ctx.strokeStyle = 'rgba(40,50,60,0.4)'; ctx.lineWidth = 1; for (let i = 0; i < 3; i++) { const sx = x + ((this.texSeed+i*37)%100)/100*this.w, sy = y + ((this.texSeed+i*53)%100)/100*this.h; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+8, sy+10); ctx.lineTo(sx+3, sy+18); ctx.stroke(); } 
        }
        
        ctx.strokeStyle = this.type==='stone'?'#2d3742':(this.type==='glass'?'#80deea':'#5a3a1a'); ctx.lineWidth = 2; ctx.strokeRect(x, y, this.w, this.h);
        if (settings.highGraphics) {
            const blik = ctx.createLinearGradient(x, y, x, y+this.h*0.35); blik.addColorStop(0, 'rgba(255,255,255,0.35)'); blik.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = blik; ctx.fillRect(x, y, this.w, this.h*0.35);
        }
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, c, o = {}) { this.x = x; this.y = y; this.vx = o.vx ?? rand(-5, 5); this.vy = o.vy ?? rand(-8, -1); this.size = o.size ?? rand(3, 7); this.color = c; this.life = 1; this.decay = o.decay ?? rand(0.012, 0.025); this.gravity = o.gravity ?? 0.3; this.shape = o.shape ?? 'circle'; this.rot = rand(0, Math.PI * 2); this.rotVel = rand(-0.2, 0.2); }
    update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; this.vx *= 0.98; this.life -= this.decay; this.rot += this.rotVel; }
    draw() { ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.translate(this.x, this.y); ctx.rotate(this.rot); ctx.fillStyle = this.color; if (this.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2); ctx.fill(); } else if (this.shape === 'feather') { ctx.beginPath(); ctx.ellipse(0, 0, this.size * 1.4, this.size * 0.5, 0, 0, Math.PI * 2); ctx.fill(); } ctx.restore(); }
}
class FloatingText {
    constructor(x, y, t, c) { this.x = x; this.y = y; this.text = t; this.color = c; this.life = 1; this.vy = -1.5; }
    update() { this.y += this.vy; this.vy *= 0.96; this.life -= 0.02; }
    draw() { ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.font = 'bold 22px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(this.text, this.x, this.y); ctx.fillStyle = this.color; ctx.fillText(this.text, this.x, this.y); ctx.restore(); }
}

function spawnBurst(x, y, c, n = 12) { if(!settings.highGraphics) n = Math.floor(n/2); for (let i = 0; i < n; i++) particles.push(new Particle(x, y, c, {vx:rand(-7,7),vy:rand(-9,0),size:rand(3,8),gravity:0.35})); }
function spawnDust(x, y, n = 8) { if(!settings.highGraphics) n = Math.floor(n/2); for (let i = 0; i < n; i++) particles.push(new Particle(x+rand(-15,15), y, 'rgba(200,180,150,0.8)', {vx:rand(-3,3),vy:rand(-4,-0.5),size:rand(4,10),gravity:0.1,decay:rand(0.02,0.04)})); }
function spawnFeathers(x, y, n = 5, c = null) { if(!settings.highGraphics) n = Math.floor(n/2); for (let i = 0; i < n; i++) feathers.push(new Particle(x, y, c||['#ff6b6b','#ffd93d','#ffffff'][randInt(0,2)], {vx:rand(-4,4),vy:rand(-6,-1),size:rand(4,8),gravity:0.06,decay:rand(0.008,0.018),shape:'feather'})); }
function addScore(a, x, y) { floatingTexts.push(new FloatingText(x, y, '+' + a, '#ffe066')); updateHUD(); }

function initBackground() {
    clouds = []; for(let i=0; i<8; i++) clouds.push({x:rand(0,W),y:rand(40,220),scale:rand(0.5,1.4),speed:rand(0.05,0.18),alpha:rand(0.35,0.85)});
    stars = []; for(let i=0; i<40; i++) stars.push({x:rand(0,W),y:rand(0,220),r:rand(0.5,1.6),twinkle:rand(0,Math.PI*2),speed:rand(0.02,0.06)});
}

function drawSky() {
    const curB = LEVELS[state.currentLevel] ? LEVELS[state.currentLevel].biome : 'day', b = BIOMES[curB];
    const sg = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 50); sg.addColorStop(0, b.skyTop); sg.addColorStop(0.5, b.skyMid); sg.addColorStop(1, b.skyBot);
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, GROUND_Y + 50);
    stars.forEach(s => { s.twinkle += s.speed; const a = 0.4 + Math.sin(s.twinkle) * 0.4; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill(); });
    if (curB === 'night' || curB === 'sunset') { ctx.save(); ctx.shadowColor = 'rgba(255,240,200,0.9)'; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(830, 100, 42, 0, Math.PI * 2); const mg = ctx.createRadialGradient(820, 90, 5, 830, 100, 45); mg.addColorStop(0, '#fffbe8'); mg.addColorStop(0.7, '#ffeeb5'); mg.addColorStop(1, '#f5d98a'); ctx.fillStyle = mg; ctx.fill(); ctx.restore(); }
    ctx.fillStyle = b.mountain; ctx.beginPath(); ctx.moveTo(0, GROUND_Y - 20); for (let x = 0; x <= W; x += 50) { const h = 60 + Math.sin(x * 0.008) * 30 + Math.sin(x * 0.021) * 20; ctx.lineTo(x, GROUND_Y - 30 - h); } ctx.lineTo(W, GROUND_Y); ctx.lineTo(0, GROUND_Y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(40,30,80,0.75)'; ctx.beginPath(); ctx.moveTo(0, GROUND_Y); for (let x = 0; x <= W; x += 40) { const h = 30 + Math.sin(x * 0.012 + 1) * 20 + Math.cos(x * 0.03) * 15; ctx.lineTo(x, GROUND_Y - h); } ctx.lineTo(W, GROUND_Y); ctx.closePath(); ctx.fill();
    clouds.forEach(c => { c.x += c.speed; if (c.x > W + 120 * c.scale) c.x = -120 * c.scale; ctx.save(); ctx.globalAlpha = c.alpha; ctx.fillStyle = 'rgba(255, 245, 235, 0.85)'; ctx.beginPath(); ctx.arc(c.x, c.y, 28*c.scale, 0, Math.PI*2); ctx.arc(c.x+30*c.scale, c.y-8*c.scale, 34*c.scale, 0, Math.PI*2); ctx.arc(c.x+65*c.scale, c.y, 26*c.scale, 0, Math.PI*2); ctx.arc(c.x+35*c.scale, c.y+12*c.scale, 30*c.scale, 0, Math.PI*2); ctx.arc(c.x+5*c.scale, c.y+10*c.scale, 22*c.scale, 0, Math.PI*2); ctx.fill(); ctx.restore(); });
}

function drawGround() {
    const curB = LEVELS[state.currentLevel] ? LEVELS[state.currentLevel].biome : 'day', b = BIOMES[curB];
    const grad = ctx.createLinearGradient(0, GROUND_Y, 0, H); grad.addColorStop(0, b.ground1); grad.addColorStop(1, b.ground2); ctx.fillStyle = grad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.fillRect(0, GROUND_Y, W, 4); ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 2;
    for (let i = 0; i < W; i += 12) { const h = 6 + Math.sin(i * 0.3 + state.time * 0.02) * 3; ctx.beginPath(); ctx.moveTo(i, GROUND_Y + 2); ctx.quadraticCurveTo(i + 3, GROUND_Y - h, i + 7, GROUND_Y + 2); ctx.stroke(); }
}

function drawSlingshotBack() {
    ctx.save(); ctx.lineCap = 'round'; if (settings.highGraphics) { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(slingshot.x, GROUND_Y + 6, 55, 10, 0, 0, Math.PI * 2); ctx.fill(); }
    const grad = ctx.createLinearGradient(slingshot.x, slingshot.y, slingshot.x + 40, GROUND_Y);
    grad.addColorStop(0, '#7a4a1e'); grad.addColorStop(1, '#4a2c10');
    ctx.strokeStyle = grad; ctx.lineWidth = 14;
    ctx.beginPath(); ctx.moveTo(slingshot.x + 30, GROUND_Y); ctx.quadraticCurveTo(slingshot.x + 32, GROUND_Y - 60, slingshot.forkRight.x, slingshot.forkRight.y); ctx.stroke();
    if (settings.highGraphics) { ctx.strokeStyle = 'rgba(30,15,5,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(slingshot.x + 30, GROUND_Y); ctx.quadraticCurveTo(slingshot.x + 32, GROUND_Y - 60, slingshot.forkRight.x, slingshot.forkRight.y); ctx.stroke(); }
    ctx.restore();
}

function drawSlingshotFront() {
    ctx.save(); ctx.lineCap = 'round';
    const grad = ctx.createLinearGradient(slingshot.x, slingshot.y, slingshot.x - 40, GROUND_Y);
    grad.addColorStop(0, '#9c5f26'); grad.addColorStop(1, '#5c3814');
    ctx.strokeStyle = grad; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.moveTo(slingshot.x - 30, GROUND_Y); ctx.quadraticCurveTo(slingshot.x - 32, GROUND_Y - 60, slingshot.forkLeft.x, slingshot.forkLeft.y); ctx.stroke();
    
    const anchorL = slingshot.forkLeft, anchorR = slingshot.forkRight;
    let birdX = bird ? bird.x : slingshot.x, birdY = bird ? bird.y : slingshot.y;

    if (bird && !bird.launched) {
        ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(anchorR.x, anchorR.y); ctx.lineTo(birdX + 3, birdY + 3); ctx.stroke();
        ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(anchorL.x, anchorL.y); ctx.lineTo(birdX - 3, birdY - 3); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(birdX, birdY + 8, 12, 8, 0, 0, Math.PI * 2); ctx.fillStyle = '#3a2410'; ctx.fill();
    } else {
        ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(anchorR.x, anchorR.y); ctx.quadraticCurveTo(anchorR.x - 10, anchorR.y + 30, anchorR.x - 5, anchorR.y + 50); ctx.stroke();
        ctx.strokeStyle = '#5a3818';
        ctx.beginPath(); ctx.moveTo(anchorL.x, anchorL.y); ctx.quadraticCurveTo(anchorL.x + 10, anchorL.y + 30, anchorL.x + 5, anchorL.y + 50); ctx.stroke();
    }
    ctx.restore();
}

function drawTrajectory() {
    if (!state.dragging || state.phase !== 'aiming' || !bird) return;
    const dx = slingshot.x - bird.x, dy = slingshot.y - bird.y;
    const power = Math.min(Math.hypot(dx, dy), MAX_PULL);
    const angle = Math.atan2(dy, dx);
    let vx = Math.cos(angle) * power * LAUNCH_MULT, vy = Math.sin(angle) * power * LAUNCH_MULT;

    let sx = slingshot.x, sy = slingshot.y;
    ctx.save(); ctx.setLineDash([6, 12]); ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    for (let i = 0; i < 80; i++) {
        vy += GRAVITY; sx += vx; sy += vy;
        if (settings.perfectPhysics) { vx *= AIR; vy *= AIR; }
        if (sy > GROUND_Y || sx > W || sx < 0) break;
        ctx.lineTo(sx, sy);
    }
    ctx.stroke(); ctx.restore();

    sx = slingshot.x; sy = slingshot.y; vx = Math.cos(angle) * power * LAUNCH_MULT; vy = Math.sin(angle) * power * LAUNCH_MULT;
    for (let i = 0; i < 80; i++) {
        vy += GRAVITY; sx += vx; sy += vy;
        if (settings.perfectPhysics) { vx *= AIR; vy *= AIR; }
        if (sy > GROUND_Y || sx > W || sx < 0) break;
        if (i % 5 === 0) {
            const t = i / 80, alpha = 0.9 * (1 - t * 0.7), r = 3.5 * (1 - t * 0.4);
            ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 220, 100, ${alpha})`;
            ctx.shadowColor = 'rgba(255,180,50,0.9)'; ctx.shadowBlur = 8; ctx.fill();
        }
    }
    ctx.shadowBlur = 0;

    const pct = power / MAX_PULL, barW = 220, barH = 16, bx = slingshot.x - barW / 2, by = GROUND_Y + 30;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(bx - 3, by - 3, barW + 6, barH + 6, 10); ctx.fill();
    const pg = ctx.createLinearGradient(bx, 0, bx + barW, 0); pg.addColorStop(0, '#4cd964'); pg.addColorStop(0.5, '#ffcc00'); pg.addColorStop(1, '#ff3b30');
    ctx.fillStyle = pg; roundRect(bx, by, barW * pct, barH, 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; roundRect(bx, by, barW * pct, barH / 2, 8); ctx.fill();
    ctx.fillStyle = 'white'; ctx.font = 'bold 12px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText(Math.round(pct * 100) + '%', bx + barW / 2, by + barH - 3);
}

function roundRect(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2; if (r < 0) r = 0;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function circleCircle(a, b) { const dx = a.x - b.x, dy = a.y - b.y, r = a.r + b.r; return dx * dx + dy * dy < r * r; }
function circleRect(c, b) { const cx = clamp(c.x, b.x, b.x + b.w), cy = clamp(c.y, b.y, b.y + b.h); return (c.x - cx)**2 + (c.y - cy)**2 < c.r**2; }
function resolveCircleRect(c, b) {
    const cx = clamp(c.x, b.x, b.x + b.w), cy = clamp(c.y, b.y, b.y + b.h); let dx = c.x - cx, dy = c.y - cy, d = Math.hypot(dx, dy);
    if (d === 0) { if (c.x < b.x + b.w/2) { dx = -1; dy = 0; } else { dx = 1; dy = 0; } d = 1; }
    const nx = dx / d, ny = dy / d; c.x += nx * (c.r - d); c.y += ny * (c.r - d);
    const dot = c.vx * nx + c.vy * ny; if (dot < 0) { c.vx -= 1.6 * dot * nx; c.vy -= 1.6 * dot * ny; c.vx *= 0.85; c.vy *= 0.85; }
}

function updatePhysics() {
    state.time++;
    birds.forEach(b => b.update()); pigs.forEach(p => p.update()); blocks.forEach(b => b.update()); eggs.forEach(e => e.update());
    eggs = eggs.filter(e => !e.exploded);
    particles = particles.filter(p => p.life > 0); particles.forEach(p => p.update());
    feathers = feathers.filter(p => p.life > 0); feathers.forEach(p => p.update());
    floatingTexts = floatingTexts.filter(t => t.life > 0); floatingTexts.forEach(t => t.update());

    if (state.shake > 0) { state.shake *= 0.85; state.shakeX = rand(-state.shake, state.shake); state.shakeY = rand(-state.shake, state.shake); if (state.shake < 0.3) state.shake = 0; }

    birds.forEach(b => {
        if (!b.launched || b.resting) return;
        const speed = Math.hypot(b.vx, b.vy);
        pigs.forEach(pig => {
            if (pig.dead || b.hitCooldown > 0) return;
            if (circleCircle(b, pig)) {
                pig.damage(999, Math.atan2(b.y-pig.y, b.x-pig.x)); 
                pig.vx = b.vx * 0.6; pig.vy = b.vy * 0.5 - 2; pig.resting = false;
                const dx = b.x - pig.x, dy = b.y - pig.y, d = Math.hypot(dx, dy) || 1;
                b.vx = (dx / d) * speed * 0.55; b.vy = (dy / d) * speed * 0.55 - 1; b.hitCooldown = 6;
                SFX.hit(); state.shake = 9; spawnBurst(pig.x, pig.y, '#ffd93d', 8);
            }
        });
        blocks.forEach(block => {
            if (block.hp <= 0 || b.hitCooldown > 0) return;
            if (circleRect(b, block)) {
                if (speed > 4) block.damage(clamp(speed * 7, 15, 130));
                resolveCircleRect(b, block); block.vx += b.vx * 0.25; block.vy += b.vy * 0.2;
                if (Math.abs(block.vx) > 1 || Math.abs(block.vy) > 1) block.resting = false;
                b.hitCooldown = 4; state.shake = Math.min(10, speed * 0.7); if (speed > 3) SFX.hit();
            }
        });
    });

    pigs.forEach(pig => {
        if (pig.dead) return;
        blocks.forEach(block => {
            if (block.hp <= 0) return;
            if (circleRect(pig, block)) { resolveCircleRect(pig, block); if (Math.hypot(pig.vx, pig.vy) > 4) pig.damage(999, Math.PI/2); pig.resting = false; }
        });
    });

    for (let i = 0; i < pigs.length; i++) {
        for (let j = i + 1; j < pigs.length; j++) {
            const a = pigs[i], b = pigs[j]; if (a.dead || b.dead) continue;
            if (circleCircle(a, b)) {
                const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, overlap = (a.r + b.r) - d, nx = dx / d, ny = dy / d;
                a.x -= nx * overlap / 2; a.y -= ny * overlap / 2; b.x += nx * overlap / 2; b.y += ny * overlap / 2;
                const dvx = b.vx - a.vx, dvy = b.vy - a.vy, imp = dvx * nx + dvy * ny;
                if (imp < 0) { a.vx += imp * nx * 0.5; a.vy += imp * ny * 0.5; b.vx -= imp * nx * 0.5; b.vy -= imp * ny * 0.5; }
                if (overlap > 1) { a.resting = false; b.resting = false; }
            }
        }
    }

    if (state.phase === 'flying') {
        const anyFlying = birds.some(b => b.launched && !b.resting && b.y < H + 100);
        if (!anyFlying && state.time - state.launchTime > 30) endShot();
    }
}

let currentBirdQueue = [];
let currentLevelIdx = 0;

function loadLevel(idx) {
    const level = LEVELS[idx];
    currentLevelIdx = idx; state.currentLevel = idx; state.score = 0; state.phase = 'idle';
    state.dragging = false; state.shake = 0; state.time = 0; state.launchTime = 0; state.birdsUsed = 0; state.abilitiesUsed = 0;
    birds = []; pigs = []; blocks = []; eggs = []; particles = []; feathers = []; floatingTexts = []; bird = null;
    lastAbilityTime = 0;

    currentBirdQueue = [...level.birds]; spawnNextBird();
    level.pigs.forEach(p => pigs.push(new Pig(p.x, p.y, p.r, p.type || 'normal')));
    level.blocks.forEach(b => blocks.push(new Block(b.x, b.y, b.w, b.h, b.type)));

    updateHUD(); hideOverlay();
    levelNameHud.textContent = `${idx + 1}. ${level.name}`;
    hint.style.opacity = '1'; setTimeout(() => { hint.style.opacity = '0.6'; }, 4000);
}

function spawnNextBird() {
    if (currentBirdQueue.length === 0) { bird = null; return false; }
    bird = new Bird(slingshot.x, slingshot.y, currentBirdQueue.shift());
    birds.push(bird); state.phase = 'idle'; updateHUD(); updateAbilityIndicator(); return true;
}

function updateAbilityIndicator() {
    const fb = birds.find(b => b.launched && !b.resting && !b.abilityUsed && b.type.ability && b.y < H);
    if (fb) { abilityIcon.textContent = fb.type.icon; abilityText.textContent = fb.type.abilityName + ' — Клик!'; abilityIndicator.classList.add('show'); }
    else abilityIndicator.classList.remove('show');
}

function updateHUD() { scoreEl.textContent = state.score; }

function endShot() {
    if (state.phase !== 'flying') return;
    if (birds.some(b => b.launched && !b.resting && b.y < H + 100)) return;
    state.phase = 'settling';

    const alivePigs = pigs.filter(p => !p.dead).length;
    if (alivePigs === 0) { setTimeout(() => { if (state.phase === 'settling') { state.phase = 'over'; showVictory(); } }, 600); return; }
    
    if (currentBirdQueue.length === 0) { setTimeout(() => { if (state.phase === 'settling') { state.phase = 'over'; showDefeat(); } }, 600); return; }

    setTimeout(() => { if (state.phase === 'settling') { birds = birds.filter(b => b.launched && !b.resting); bird = null; spawnNextBird(); } }, 700);
}

function showVictory() {
    const unusedBirds = currentBirdQueue.length;
    if (unusedBirds > 0) {
        const bonus = unusedBirds * 10000;
        state.score += bonus;
        addScore(bonus, slingshot.x + 50, slingshot.y - 50);
        SFX.star(); updateHUD();
    }

    const level = LEVELS[currentLevelIdx]; 
    const maxPossible = (level.pigs.length * 5000) + (level.blocks.length * 500) + 10000;
    let stars = 1;
    if (state.score >= maxPossible * 0.85) stars = 3; 
    else if (state.score >= maxPossible * 0.60) stars = 2;
    
    if (!saveData.levels[currentLevelIdx] || state.score > saveData.levels[currentLevelIdx].score) saveData.levels[currentLevelIdx] = { score: state.score, stars };
    saveGame(); checkAchievements();

    overlayTitle.textContent = 'Победа!'; overlayScore.textContent = state.score;
    overlayStars.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    nextLevelBtn.style.display = (currentLevelIdx < LEVELS.length - 1) ? 'flex' : 'none';
    overlay.classList.add('show'); SFX.win(); buildLevelsGrid();
}

function showDefeat() {
    overlayTitle.textContent = 'Провал...'; overlayScore.textContent = state.score; overlayStars.textContent = '☆☆☆';
    nextLevelBtn.style.display = 'none'; overlay.classList.add('show'); SFX.lose();
}

function hideOverlay() { overlay.classList.remove('show'); }

function getMouse(e) {
    const rect = canvas.getBoundingClientRect(), scaleX = W / rect.width, scaleY = H / rect.height;
    let cx, cy;
    if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches.length > 0) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
}

function onDown(e) {
    ensureAudio(); if (state.phase === 'over' || state.phase === 'menu') return;
    const m = getMouse(e), now = performance.now();

    if (state.phase === 'flying') {
        const fb = birds.find(b => b.launched && !b.resting && !b.abilityUsed && b.type.ability && b.y < H);
        if (fb && now - lastAbilityTime > 300) { lastAbilityTime = now; if (fb.activateAbility()) { updateAbilityIndicator(); return; } }
        return;
    }

    if (state.phase !== 'idle' || !bird || bird.launched) return;
    if (dist(m.x, m.y, bird.x, bird.y) < 70 || dist(m.x, m.y, slingshot.x, slingshot.y) < 70) {
        state.dragging = true; state.phase = 'aiming'; SFX.pull();
    }
}

function onMove(e) {
    if (!state.dragging || !bird) return; e.preventDefault();
    const m = getMouse(e); let dx = m.x - slingshot.x, dy = m.y - slingshot.y;
    if (dx > 0) dx = 0;
    const d = Math.hypot(dx, dy); if (d > MAX_PULL) { dx = dx / d * MAX_PULL; dy = dy / d * MAX_PULL; }
    bird.x = slingshot.x + dx; bird.y = slingshot.y + dy; bird.angle = Math.atan2(-dy, -dx);
}

function onUp(e) {
    if (!state.dragging || !bird) return; state.dragging = false;
    const dx = slingshot.x - bird.x, dy = slingshot.y - bird.y, power = Math.hypot(dx, dy);
    if (power < 18) { bird.x = slingshot.x; bird.y = slingshot.y; bird.angle = 0; state.phase = 'idle'; return; }
    const angle = Math.atan2(dy, dx), vx = Math.cos(angle) * power * LAUNCH_MULT, vy = Math.sin(angle) * power * LAUNCH_MULT;
    bird.launch(vx, vy); bird.angle = Math.atan2(vy, vx);
    state.phase = 'flying'; state.launchTime = state.time; hint.style.opacity = '0'; updateAbilityIndicator();
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('mouseleave', () => { if (state.dragging && bird) onUp({ clientX: 0, clientY: 0 }); });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); onUp(e); }, { passive: false });
canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); onUp(e); }, { passive: false });

function showGameUI() { hud.style.display = 'flex'; controls.style.display = 'flex'; hint.style.display = 'block'; }
function hideGameUI() { hud.style.display = 'none'; controls.style.display = 'none'; hint.style.display = 'none'; abilityIndicator.classList.remove('show'); }

function buildLevelsGrid() {
    levelsContainer.innerHTML = '';
    const categories = { day: [], sunset: [], desert: [], night: [], ice: [] };
    
    LEVELS.forEach((level, idx) => {
        const biome = level.biome || 'day';
        if (categories[biome]) categories[biome].push({ level, idx });
    });

    for (const [biomeKey, levelsList] of Object.entries(categories)) {
        if (levelsList.length === 0) continue;
        
        const header = document.createElement('div');
        header.className = 'category-title';
        header.innerHTML = `${BIOMES[biomeKey].icon} ${BIOMES[biomeKey].name}`;
        levelsContainer.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'levels-grid';

        levelsList.forEach(({ level, idx }) => {
            const unlocked = idx === 0 || saveData.levels[idx - 1];
            const best = saveData.levels[idx];
            const card = document.createElement('div'); card.className = 'level-card' + (unlocked ? '' : ' locked');
            card.innerHTML = `<div class="level-num">#${idx+1}</div><div class="level-name">${level.name}</div>`;
            const bd = document.createElement('div'); bd.className = 'level-birds';
            level.birds.forEach(t => { const i = document.createElement('div'); i.className = 'bird-icon ' + t; bd.appendChild(i); });
            card.appendChild(bd);
            const st = document.createElement('div'); st.className = 'level-stars';
            st.textContent = best ? '⭐'.repeat(best.stars) + '☆'.repeat(3 - best.stars) : '☆☆☆'; card.appendChild(st);
            if (!unlocked) { const l = document.createElement('div'); l.className = 'level-lock'; l.textContent = '🔒'; card.appendChild(l); }
            else { card.addEventListener('click', () => { ensureAudio(); startMusic(); levelsScreen.classList.remove('show'); showGameUI(); loadLevel(idx); }); }
            grid.appendChild(card);
        });

        levelsContainer.appendChild(grid);
    }
}

function buildAchievementsGrid() {
    achievementsGrid.innerHTML = '';
    for (const [id, ach] of Object.entries(ACHIEVEMENTS)) {
        const has = saveData.achievements[id];
        const card = document.createElement('div');
        card.className = 'level-card' + (has ? '' : ' locked');
        card.innerHTML = `<div style="font-size:40px; margin-bottom:8px; filter:${has?'none':'grayscale(1) opacity(0.5)'};">${ach.icon}</div>
            <div class="level-name" style="color:#e63946; font-size:16px;">${ach.name}</div>
            <div style="font-size:11px; color:#5a4a3a; font-weight:600; line-height:1.3;">${ach.desc}</div>`;
        achievementsGrid.appendChild(card);
    }
}

function draw() {
    ctx.save(); ctx.translate(state.shakeX, state.shakeY);
    drawSky(); drawGround(); drawSlingshotBack();
    blocks.forEach(b => b.draw()); pigs.forEach(p => p.draw()); eggs.forEach(e => e.draw());
    birds.filter(b => !b.isChild).forEach(b => b.draw()); birds.filter(b => b.isChild).forEach(b => b.draw());
    particles.forEach(p => p.draw()); feathers.forEach(p => p.draw());
    drawSlingshotFront(); drawTrajectory(); floatingTexts.forEach(t => t.draw());
    if (state.phase !== 'menu') drawBirdQueue();
    ctx.restore();
}

function drawBirdQueue() {
    const startX = 55, y = GROUND_Y + 40;
    for (let i = 0; i < currentBirdQueue.length; i++) {
        const typeKey = currentBirdQueue[i], t = BIRD_TYPES[typeKey], x = startX + i * 46;
        ctx.save(); ctx.translate(x, y); ctx.scale(0.7, 0.7);
        const g = ctx.createRadialGradient(-8, -8, 2, 0, 0, 22); g.addColorStop(0, t.color1); g.addColorStop(1, t.color3);
        if (typeKey === 'yellow') { ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-18, -20); ctx.lineTo(-18, 20); ctx.closePath(); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(120,80,0,0.8)'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke(); }
        else { ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2; ctx.stroke(); }
        ctx.beginPath(); ctx.arc(-5, -5, 5, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill();
        ctx.beginPath(); ctx.arc(5, -5, 5, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill();
        ctx.beginPath(); ctx.arc(-5, -5, 2.5, 0, Math.PI * 2); ctx.fillStyle = 'black'; ctx.fill();
        ctx.beginPath(); ctx.arc(5, -5, 2.5, 0, Math.PI * 2); ctx.fillStyle = 'black'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-12, -12); ctx.lineTo(2, -16); ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(22, 4); ctx.lineTo(8, 10); ctx.closePath(); ctx.fillStyle = '#ffd93d'; ctx.fill(); ctx.strokeStyle = '#a86a00'; ctx.lineWidth = 1; ctx.stroke();
        ctx.restore();
        ctx.save(); ctx.font = 'bold 10px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2; ctx.strokeText(t.name, x, y + 26); ctx.fillText(t.name, x, y + 26); ctx.restore();
    }
}

function drawMenuBackground() { drawSky(); drawGround(); }

let lastTime = 0, accumulator = 0, STEP = 1000 / 60;
let fpsLastTime = performance.now(), frames = 0;

function gameLoop(t) {
    if (!lastTime) lastTime = t;
    let dt = t - lastTime; lastTime = t; if (dt > 100) dt = 100;
    
    frames++;
    if (t - fpsLastTime >= 1000) {
        if(settings.showFps) fpsCounter.textContent = 'FPS: ' + frames;
        frames = 0;
        fpsLastTime = t;
    }

    accumulator += dt; let steps = 0;
    while (accumulator >= STEP && steps < 5) {
        if (state.phase !== 'menu') updatePhysics(); else { particles.forEach(p => p.update()); particles = particles.filter(p => p.life > 0); state.time++; }
        accumulator -= STEP; steps++;
    }
    if (state.phase === 'menu') drawMenuBackground(); else draw();
    updateAbilityIndicator(); requestAnimationFrame(gameLoop);
}

loadSettings();
initBackground();
loadSave();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
